apply plugin: 'com.android.application'

android {
    namespace 'dev.golobokov.bbwa'
    compileSdkVersion 19

    defaultConfig {
        applicationId "dev.golobokov.bbwa"
        minSdkVersion 18
        targetSdkVersion 19
        versionCode 2
        versionName "1.0.1"
    }

    // Release intentionally has no checked-in signingConfig. Supply a private
    // key for distribution; debug signing is only for local sideloading.
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        abortOnError false
        // This APK is sideloaded onto BlackBerry 10 and Android 4.x devices;
        // it cannot target API 31 and still run there, and it is not going to
        // the Play Store.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 3.12.x is the last OkHttp line that still supports Android 4.x / API 18.
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.google.code.gson:gson:2.8.9'
}
