name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The client forwards private messages, so a known-vulnerable dependency
      # is a build failure rather than a warning.
      - run: npm audit --audit-level=high

  android:
    name: android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # sdkmanager needs a recent JDK, the build needs 11, and setup-java sets
      # JAVA_HOME for every step that follows it. So: SDK first, then Java.
      - name: Install the API 19 platform
        run: |
          sdkmanager "platforms;android-19" "build-tools;30.0.3" > /dev/null
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --console=plain --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bbwa-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
