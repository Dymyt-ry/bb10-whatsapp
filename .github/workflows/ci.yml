name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The client forwards private messages, so a known-vulnerable dependency
      # is a build failure rather than a warning.
      - run: npm audit --audit-level=high

  android:
    name: android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # sdkmanager needs a recent JDK, the build needs 11, and setup-java sets
      # JAVA_HOME for every step that follows it. So: SDK first, then Java.
      - name: Install the API 19 platform
        run: |
          SDKMANAGER=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_SDK_ROOT"; exit 1
          fi
          # sdkmanager is built for a newer class file version than 11.
          JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}" \
            "$SDKMANAGER" "platforms;android-19" "build-tools;30.0.3" > /dev/null
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug lintDebug --console=plain --no-daemon
      - name: Fail on any lint error
        working-directory: android
        run: |
          python3 - <<'PY'
          import sys, xml.dom.minidom as m
          d = m.parse('app/build/reports/lint-results-debug.xml')
          bad = [i for i in d.getElementsByTagName('issue')
                 if i.getAttribute('severity') in ('Fatal', 'Error')]
          for i in bad:
              print('%s: %s' % (i.getAttribute('id'), i.getAttribute('message')))
          sys.exit(1 if bad else 0)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bbwa-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
